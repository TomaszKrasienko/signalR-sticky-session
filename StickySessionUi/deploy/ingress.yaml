apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stickysessionui
spec:
  ingressClassName: traefik
  rules:
    - host: sticky.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stickysessionui
                port:
                  number: 80
